name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-desktop:
    name: Build & Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-15-intel'
            target: 'x86_64-apple-darwin'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Tag Matches App Version
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          RELEASE_TAG="${{ inputs.tag || github.ref_name }}"
          TAG_VERSION="${RELEASE_TAG#v}"
          echo "Tag version: ${TAG_VERSION}, app version: ${APP_VERSION}"
          if [ "${TAG_VERSION}" != "${APP_VERSION}" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match src-tauri/tauri.conf.json version ${APP_VERSION}. Update the version and re-tag."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup MSVC (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Node Dependencies
        run: npm ci --ignore-scripts

      # --ignore-scripts skips better-sqlite3's install script, which is what
      # fetches/builds its native binding. Without this step the shipped app's
      # API server crashes on startup with "Could not locate the bindings file".
      - name: Rebuild Native Modules
        run: npm rebuild better-sqlite3

      - name: Build Web Client & Server
        run: npm run build:desktop

      - name: Build Tauri Desktop & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'SalEdge BSMS ${{ inputs.tag || github.ref_name }}'
          releaseBody: 'See the release assets below for macOS, Windows, and Linux standalone desktop installers.'
          releaseDraft: false
          prerelease: false
