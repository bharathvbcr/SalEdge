name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Typecheck, Test, Build & Cargo Check
    runs-on: ubuntu-22.04 # matches release.yml; 24.04 dropped libappindicator3-dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # tauri-build validates externalBin entries at compile time, so the
      # sidecar binary must exist before cargo check runs.
      - name: Download Node Sidecar
        run: node scripts/fetch-node-sidecar.mjs x86_64-unknown-linux-gnu

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      # Build BEFORE tests: the stress suite boots the real server from
      # dist-server/index.mjs, which does not exist on a fresh checkout.
      - name: Build Web Client
        run: npm run build

      - name: Build Server Bundle
        run: npm run build:server

      - name: Run Tests (unit + stress + fuzz)
        run: npm test

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml
