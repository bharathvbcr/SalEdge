name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Typecheck, Test, Build & Cargo Check
    runs-on: ubuntu-22.04 # matches release.yml; 24.04 dropped libappindicator3-dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Bun installs and runs scripts; the tools and tests still run on Node 22.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # tauri-build validates externalBin entries at compile time, so the
      # sidecar binary must exist before cargo check runs.
      - name: Download Node Sidecar
        run: node scripts/fetch-node-sidecar.mjs x86_64-unknown-linux-gnu

      # Bun runs better-sqlite3's install script with the `node` on PATH
      # (Node 22 above), so the binding matches the sidecar's ABI.
      - name: Install Node Dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck
        run: bun run typecheck

      # Build BEFORE tests: the stress suite boots the real server from
      # dist-server/index.mjs, which does not exist on a fresh checkout.
      - name: Build Web Client
        run: bun run build

      - name: Build Server Bundle
        run: bun run build:server

      - name: Run Tests (unit + stress + fuzz)
        run: bun run test

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml
