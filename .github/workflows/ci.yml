name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# This job checks out and compiles. It does not push or publish.
# contents: read is the minimum for checkout. Cache writes are best-effort:
# rust-cache logs a save failure and still exits 0, so a cache miss cannot
# turn a failed compile into a success.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Test, Build & Cargo Check
    runs-on: ubuntu-22.04 # matches release.yml; 24.04 dropped libappindicator3-dev
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Bun version comes from package.json "packageManager" (setup-bun@v2).
      # The tools and tests still run on Node 22, matching the sidecar ABI.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # tauri-build validates externalBin entries at compile time, so the
      # sidecar binary must exist before cargo check runs.
      - name: Download Node Sidecar
        run: node scripts/fetch-node-sidecar.mjs x86_64-unknown-linux-gnu

      # Bun runs better-sqlite3's install script with the `node` on PATH
      # (Node 22 above), so the binding matches the sidecar's ABI.
      - name: Install Node Dependencies
        run: bun install --frozen-lockfile

      # One project script: typecheck, client build, server bundle, tests, cargo check.
      # Tests boot dist-server/index.mjs, so the script builds before it tests.
      - name: Typecheck, build, test, and cargo check
        run: bun run ci:local
