<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Metallic Shell Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Inner Core Red Glow -->
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Cyan Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    
    <!-- Glowing Shadow Filters -->
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Battery Top Cap -->
  <path d="M 216 90 L 296 90 A 12 12 0 0 1 308 102 L 308 116 L 204 116 L 204 102 A 12 12 0 0 1 216 90 Z" fill="url(#metalGrad)" />
  
  <!-- Battery Body -->
  <rect x="140" y="116" width="232" height="310" rx="36" fill="#0f172a" stroke="url(#metalGrad)" stroke-width="16" />
  
  <!-- Inner Battery Bezel -->
  <rect x="164" y="140" width="184" height="262" rx="22" fill="#1e293b" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Glowing Energy Cells (Red) -->
  <g filter="url(#glowRed)">
    <!-- Battery Charge Indicator bars -->
    <rect x="180" y="340" width="152" height="40" rx="6" fill="url(#coreGrad)" />
    <rect x="180" y="285" width="152" height="40" rx="6" fill="url(#coreGrad)" />
    <rect x="180" y="230" width="152" height="40" rx="6" fill="url(#coreGrad)" />
    <rect x="180" y="175" width="152" height="40" rx="6" fill="url(#coreGrad)" />
  </g>

  <!-- Circuit Trace Details -->
  <path d="M 180 156 L 196 156 L 196 180" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <circle cx="180" cy="156" r="4" fill="#475569" />
  
  <path d="M 332 156 L 316 156 L 316 180" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <circle cx="332" cy="156" r="4" fill="#475569" />

  <!-- Plus / Minus Symbols -->
  <!-- Plus Sign -->
  <path d="M 244 140 L 268 140 M 256 128 L 256 152" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <!-- Minus Sign -->
  <path d="M 244 388 L 268 388" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round" />

  <!-- Cyan Glowing Lightning Bolt (overlays top) -->
  <g filter="url(#glowCyan)">
    <path d="M 285 100 
             L 175 270 
             L 245 270 
             L 215 420 
             L 335 235 
             L 265 235 
             Z" 
          fill="url(#boltGrad)" 
          stroke="#e0f2fe" 
          stroke-width="4" 
          stroke-linejoin="round" />
  </g>
</svg>
